name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements/base.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements/base.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: frontend/coverage/lcov.info
          flags: frontend

  test-scraping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: scraping-service/package-lock.json

      - name: Install dependencies
        run: |
          cd scraping-service
          npm ci

      - name: Install Playwright browsers
        run: |
          cd scraping-service
          npx playwright install

      - name: Run scraping service tests
        run: |
          cd scraping-service
          npm test

  test-ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run AI service tests
        run: |
          cd ai-service
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ai-service/coverage.xml
          flags: ai-service

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-scraping-service, test-ai-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright
        run: |
          npm install -g @playwright/test
          playwright install

      - name: Create environment file
        run: |
          cat > .env << EOF
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=password
          REDIS_URL=redis://localhost:6379
          SECRET_KEY=test-secret-key
          DEBUG=true
          EOF

      - name: Start services
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 60  # Wait for services to be ready

      - name: Run E2E tests
        run: |
          playwright test

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Stop services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-scraping-service, test-ai-service, security-scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Scraping Service
        id: meta-scraping
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-scraping

      - name: Build and push Scraping Service image
        uses: docker/build-push-action@v4
        with:
          context: ./scraping-service
          push: true
          tags: ${{ steps.meta-scraping.outputs.tags }}
          labels: ${{ steps.meta-scraping.outputs.labels }}

      - name: Extract metadata (tags, labels) for AI Service
        id: meta-ai
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai

      - name: Build and push AI Service image
        uses: docker/build-push-action@v4
        with:
          context: ./ai-service
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-push, e2e-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to Staging Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_STAGING }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
          # Update image tags in manifests
          sed -i "s|{{IMAGE_TAG}}|$IMAGE_TAG|g" infrastructure/k8s/staging/*.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f infrastructure/k8s/staging/
          
          # Wait for deployment to complete
          kubectl rollout status deployment/yggdrasil-backend -n yggdrasil-staging
          kubectl rollout status deployment/yggdrasil-frontend -n yggdrasil-staging

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Get staging URL and run basic health checks
          STAGING_URL=$(kubectl get ingress yggdrasil-ingress -n yggdrasil-staging -o jsonpath='{.spec.rules[0].host}')
          curl -f "https://$STAGING_URL/health" || exit 1

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, e2e-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to Production Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
          # Update image tags in manifests
          sed -i "s|{{IMAGE_TAG}}|$IMAGE_TAG|g" infrastructure/k8s/production/*.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f infrastructure/k8s/production/
          
          # Wait for deployment to complete
          kubectl rollout status deployment/yggdrasil-backend -n yggdrasil-production
          kubectl rollout status deployment/yggdrasil-frontend -n yggdrasil-production

      - name: Run post-deployment tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Get production URL and run health checks
          PROD_URL=$(kubectl get ingress yggdrasil-ingress -n yggdrasil-production -o jsonpath='{.spec.rules[0].host}')
          curl -f "https://$PROD_URL/health" || exit 1

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## Changes in this Release
            - Automated release from main branch
            - Build: ${{ github.sha }}
            - Deployed to production
            
            ## Docker Images
            - Backend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            - Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            - Scraping: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-scraping:${{ github.sha }}
            - AI Service: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai:${{ github.sha }}
          draft: false
          prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    steps:
      - name: Notify on success
        if: ${{ contains(join(needs.*.result, ','), 'success') }}
        run: |
          echo "✅ Deployment successful!"
          # Add notification logic here (Slack, Discord, etc.)

      - name: Notify on failure
        if: ${{ contains(join(needs.*.result, ','), 'failure') }}
        run: |
          echo "❌ Deployment failed!"
          # Add notification logic here (Slack, Discord, etc.)